<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ClassBoard · 周课表 — 清新浅色极简（风格预览 01）</title>
<style>
/* ============ 清新浅色极简 · 设计令牌 ============ */
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --line:#e7eaf0;
  --line-strong:#d8dde6;
  --text:#1f2933;
  --text-2:#4b5563;
  --text-3:#6b7280;
  --accent:#3b82f6;
  --accent-strong:#2563eb;
  --accent-soft:#eff6ff;
  --accent-line:#bfdbfe;
  --radius:12px;
  --ph:64px;            /* 每节课行高 */
  --tc-w:64px;          /* 节次列宽 */
  --shadow-card:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --shadow-pop:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 入场动画（克制） */
.reveal{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;animation:none}
  *{transition:none!important;animation:none!important}
}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  height:60px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:0 clamp(14px,3.5vw,32px);
}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:.2px;color:var(--text);white-space:nowrap}
.brand .logo{color:var(--accent)}
.seg{
  margin:0 auto;
  display:flex;align-items:center;gap:2px;
  background:#eef1f5;border:1px solid #e4e8ef;border-radius:10px;padding:3px;
}
.seg-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:8px;
  font-size:13px;color:#4b5563;
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg-btn svg{width:15px;height:15px}
.seg-btn.active{background:#fff;color:#111827;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px rgba(16,24,40,.03)}
.seg-btn:not(.active):hover{color:#111827}
.top-actions{display:flex;align-items:center;gap:8px}
.btn-import{
  display:flex;align-items:center;gap:6px;
  background:var(--accent);color:#fff;
  font-size:13.5px;font-weight:600;
  padding:8px 14px;border-radius:8px;
  box-shadow:0 1px 2px rgba(37,99,235,.28);
  transition:background .18s,box-shadow .18s;
}
.btn-import:hover{background:var(--accent-strong);box-shadow:0 3px 8px rgba(37,99,235,.32)}
.btn-import:active{transform:translateY(1px)}
.btn-import svg{width:15px;height:15px}
.btn-icon{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  color:#4b5563;border:1px solid transparent;
  transition:background .18s,border-color .18s,color .18s;
}
.btn-icon:hover{background:#f1f4f8;border-color:var(--line);color:var(--text)}
.btn-icon svg{width:18px;height:18px}

/* ============ 页面布局 ============ */
.page{
  max-width:1440px;margin:0 auto;
  padding:24px clamp(14px,3vw,32px) 8px;
  display:grid;grid-template-columns:minmax(0,1fr) 296px;
  gap:24px;align-items:start;
}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}

/* 周导航条 */
.weeknav{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:10px;
}
.wn-title{
  text-align:center;font-size:15px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wn-title span{color:var(--text-2);font-weight:500}
.wn-btn{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--text-2);font-size:13px;white-space:nowrap;
  transition:border-color .18s,color .18s,background .18s,box-shadow .18s;
}
.wn-btn:hover{border-color:var(--line-strong);color:var(--text);background:#fafbfc;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.wn-btn:active{transform:translateY(1px)}
.wn-btn svg{width:15px;height:15px}
.wn-right{display:flex;align-items:center;gap:8px}

/* ============ 周课表卡片 ============ */
.schedule-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-card);
  overflow:hidden;
}
.scroll-hint{display:none}
.sched-scroll{overflow:hidden}
.sched{display:grid;grid-template-columns:var(--tc-w) minmax(0,1fr);grid-template-rows:auto repeat(8,var(--ph))}
.day-cols{grid-column:2;grid-row:1/10;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0}

.corner{
  grid-column:1;grid-row:1;
  position:sticky;top:0;left:0;z-index:6;
  background:#fbfcfe;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.time-col{
  grid-column:1;grid-row:2/10;
  position:sticky;left:0;z-index:4;
  display:grid;grid-template-rows:repeat(8,var(--ph));
  background:#fbfcfe;border-right:1px solid var(--line);
}
.time-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.time-cell b{font-size:12px;font-weight:600;color:var(--text-2)}
.time-cell span{font-size:11px;color:var(--text-3)}

.day-col{min-width:0}
.day-col:not(:first-child){border-left:1px solid var(--line)}
.day-head{
  position:sticky;top:0;z-index:5;
  background:#fbfcfe;border-bottom:1px solid var(--line);
  padding:10px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:background .2s;
}
.day-head .wd{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text-2)}
.day-head .pill{
  font-size:10.5px;font-weight:600;color:#fff;background:var(--accent);
  border-radius:999px;padding:1px 7px;line-height:1.5;
}
.day-head .dt{font-size:11.5px;color:var(--text-3)}
.day-col.today .day-head{background:var(--accent-soft)}
.day-col.today .wd{color:var(--accent-strong)}
.day-col.today .dt{color:var(--accent-strong);font-weight:600}
.day-body{
  position:relative;
  display:grid;grid-template-rows:repeat(8,var(--ph));
  background-color:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ph) - 1px),var(--line) var(--ph));
}
.day-col.today .day-body{background-color:rgba(59,130,246,.045)}

/* 课程色块 */
.course{
  position:relative;margin:3px;border-radius:8px;
  padding:7px 9px;text-align:left;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:0;
  border:1px solid;
  cursor:pointer;
  transition:box-shadow .18s,transform .18s,border-color .18s;
}
.course:hover{box-shadow:0 4px 12px rgba(16,24,40,.09);transform:translateY(-1px)}
.course:active{transform:none}
.c-name{font-size:12.5px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c-loc{font-size:11px;color:var(--text-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.c-blue{background:#eef4ff;border-color:#c3d8fb}
.c-blue .c-name{color:#1e40af}
.c-green{background:#ecf8f0;border-color:#bce6cd}
.c-green .c-name{color:#166534}
.c-purple{background:#f3efff;border-color:#d4c6fb}
.c-purple .c-name{color:#5b21b6}
.c-orange{background:#fdf2e7;border-color:#f6d5b0}
.c-orange .c-name{color:#9a3412}
.c-cyan{background:#ecf9fb;border-color:#b7e3ec}
.c-cyan .c-name{color:#155e75}
.c-rose{background:#fdeef1;border-color:#f6c4ce}
.c-rose .c-name{color:#9f1239}
.c-indigo{background:#eef1fd;border-color:#c7cff9}
.c-indigo .c-name{color:#3730a3}
.c-yellow{background:#fdf8e3;border-color:#f2e2a0}
.c-yellow .c-name{color:#713f12}

/* ============ 今日视图 ============ */
.today-view{display:flex;flex-direction:column;gap:14px}
.today-head{display:flex;align-items:baseline;gap:10px;padding:2px 2px 0}
.today-head h2{font-size:18px;font-weight:700}
.today-head span{font-size:13px;color:var(--text-3)}
.today-card{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-card);padding:15px 18px;
  cursor:pointer;text-align:left;transition:box-shadow .18s,transform .18s,border-color .18s;
}
.today-card:hover{box-shadow:0 6px 16px rgba(16,24,40,.08);transform:translateY(-1px);border-color:var(--line-strong)}
.tc-dot{width:10px;height:10px;border-radius:3px;flex:none}
.tc-time{font-size:13px;font-weight:600;min-width:92px;color:var(--text)}
.tc-main{flex:1;min-width:0}
.tc-name{display:block;font-size:14.5px;font-weight:600}
.tc-loc{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.tc-slot{font-size:12px;color:var(--text-3);white-space:nowrap}
.today-empty{
  font-size:13px;color:var(--text-3);
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:20px;text-align:center;
}

/* ============ 右侧信息面板 ============ */
.side-panel{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.sp-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-card);padding:16px 18px;
}
.sp-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.sp-head .ic{
  width:28px;height:28px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.sp-head .ic svg{width:15px;height:15px}
.sp-head h3{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.8px}
.summary-nums{display:flex;gap:28px}
.num b{font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.num span{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.progress{margin-top:15px}
.progress .p-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-bottom:6px}
.progress .bar{height:6px;border-radius:999px;background:#eef1f5;overflow:hidden}
.progress .bar i{display:block;height:100%;width:44%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#60a5fa)}
.date-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--accent-strong);
  background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:999px;padding:3px 11px;margin-bottom:9px;
}
.sp-item-title{font-size:14px;font-weight:600;color:var(--text)}
.sp-item-meta{font-size:12px;color:var(--text-3);margin-top:3px}
.sp-card.hw .date-chip{color:#b45309;background:#fffbeb;border-color:#fde68a}

/* ============ 课程详情弹层 ============ */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,23,42,.42);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  width:min(400px,100%);
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-pop);
  overflow:hidden;animation:pop .22s cubic-bezier(.2,.7,.2,1);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.modal-head .dot{width:10px;height:10px;border-radius:3px;flex:none}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{
  margin-left:auto;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border-radius:7px;color:var(--text-3);transition:background .15s,color .15s;
}
.modal-close:hover{background:#f1f4f8;color:var(--text)}
.modal-close svg{width:16px;height:16px}
.modal-body{padding:15px 18px 18px;display:grid;gap:12px}
.m-row{display:grid;grid-template-columns:88px 1fr;gap:12px;font-size:13px;align-items:start}
.m-row .k{display:flex;align-items:center;gap:7px;color:var(--text-3);padding-top:1px}
.m-row .k svg{width:14px;height:14px}
.m-row .v{color:var(--text);font-weight:500}
.m-note .v{
  font-weight:400;color:var(--text-2);line-height:1.65;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}

/* ============ 页脚 ============ */
.foot{
  text-align:center;font-size:11.5px;color:var(--text-3);
  padding:26px 16px 34px;letter-spacing:.3px;
}

/* ============ 响应式 ============ */
@media (max-width:1279px){
  .page{grid-template-columns:minmax(0,1fr);padding-bottom:8px}
  .side-panel{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .sched-scroll{--ph:52px}
}
@media (max-width:767px){
  .topbar{height:56px;gap:8px;padding:0 12px}
  .brand{font-size:15px}
  .seg-btn{padding:6px 9px;gap:5px}
  .seg-btn span{font-size:12.5px}
  .btn-import{padding:8px 10px}
  .btn-import span{font-size:12.5px}
  .page{padding:16px 12px 0;gap:14px}
  .main{gap:12px}
  .weeknav{gap:6px}
  .wn-btn{padding:0 9px}
  .wn-btn span{display:none}
  .wn-title{font-size:13px}
  .wn-title span{font-size:12px}
  .scroll-hint{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--text-3);
    padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .scroll-hint svg{width:14px;height:14px}
  .sched-scroll{
    --ph:56px;
    overflow:auto;-webkit-overflow-scrolling:touch;
    max-height:calc(100dvh - 158px);min-height:420px;
  }
  .sched{grid-template-columns:var(--tc-w) 980px;grid-template-rows:auto repeat(8,var(--ph))}
  .day-cols{grid-template-columns:repeat(7,140px)}
  .schedule-card{border-radius:10px}
  .side-panel{grid-template-columns:minmax(0,1fr);gap:12px}
  .sched-scroll::-webkit-scrollbar{height:8px;width:8px}
  .sched-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px}
  .sched-scroll::-webkit-scrollbar-track{background:transparent}
  .today-card{gap:12px;padding:13px 14px}
  .tc-time{min-width:80px;font-size:12.5px}
  .today-head h2{font-size:16px}
}
</style>
</head>
<body>

<!-- 顶部导航栏 -->
<header class="topbar">
  <div class="brand">
    <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="17" rx="3"/>
      <path d="M8 2v4M16 2v4M3 9.5h18"/>
      <path d="M8.5 14h2M13.5 14h2M8.5 17.5h2M13.5 17.5h2"/>
    </svg>
    <span>ClassBoard</span>
  </div>

  <div class="seg" role="tablist" aria-label="视图切换">
    <button class="seg-btn active" data-view="week" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      <span>周课表</span>
    </button>
    <button class="seg-btn" data-view="today" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      <span>今天</span>
    </button>
  </div>

  <div class="top-actions">
    <button class="btn-import" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      <span>导入课程</span>
    </button>
    <button class="btn-icon" type="button" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="page">
  <main class="main">
    <!-- 周导航条 -->
    <div class="weeknav week-mode reveal" style="animation-delay:.03s">
      <button class="wn-btn" id="prevWeek" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span>上一周</span>
      </button>
      <div class="wn-title" id="weekTitle">第 5 周 · <span>9月2日–9月8日</span></div>
      <div class="wn-right">
        <button class="wn-btn" id="nextWeek" type="button">
          <span>下一周</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="wn-btn" id="goNow" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>回到本周</span>
        </button>
      </div>
    </div>

    <!-- 周课表网格 -->
    <section class="schedule-card week-mode reveal" style="animation-delay:.09s">
      <div class="scroll-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6-6 6 6 6"/><path d="m15 6 6 6-6 6"/></svg>
        <span>左右滑动查看本周全部课程 · 点击课程查看详情</span>
      </div>
      <div class="sched-scroll" id="schedScroll">
        <div class="sched">
          <div class="corner"></div>
          <div class="time-col" id="timeCol"></div>
          <div class="day-cols" id="dayCols"></div>
        </div>
      </div>
    </section>

    <!-- 今日视图（切换「今天」时显示） -->
    <section class="today-view" id="todayView" hidden>
      <div class="today-head">
        <h2>今天 · 9月4日 周三</h2>
        <span id="todayCount"></span>
      </div>
      <div id="todayList"></div>
      <div class="today-empty" id="todayEmpty" hidden>今天没有排课，享受空闲时光</div>

  <!-- 右侧信息面板（<1280px 折叠到课表下方） -->
  <aside class="side-panel">
    <div class="sp-card reveal" style="animation-delay:.14s">
      <div class="sp-head">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></span>
        <h3>本周摘要</h3>
      </div>
      <div class="summary-nums">
        <div class="num"><b>8</b><span>门课程</span></div>
        <div class="num"><b>4</b><span>已上</span></div>
      </div>
      <div class="progress">
        <div class="p-top"><span>本周进度</span><span>4 / 9</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>

    <div class="sp-card reveal" style="animation-delay:.19s">
      <div class="sp-head">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></span>
        <h3>考试</h3>
      </div>
      <div class="date-chip">9月20日</div>
      <div class="sp-item-title">高等数学 · 期中考试</div>
      <div class="sp-item-meta">博学楼 A101 · 08:00 开考</div>
    </div>

    <div class="sp-card hw reveal" style="animation-delay:.24s">
      <div class="sp-head">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8M16 13H8M16 17H8"/></svg></span>
        <h3>作业</h3>
      </div>
      <div class="date-chip">9月15日</div>

<footer class="foot reveal" style="animation-delay:.3s">ClassBoard · 风格预览 01 · 清新浅色极简 · 数据为 Mock 演示</footer>

<!-- 课程详情弹层 -->
<div class="modal-mask" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="课程详情">
    <div class="modal-head">
      <span class="dot" id="modalDot"></span>
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="m-row">
        <span class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>教师</span>
        <span class="v" id="mTeacher"></span>
      </div>
      <div class="m-row">
        <span class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>地点</span>
        <span class="v" id="mLoc"></span>
      </div>
      <div class="m-row">
        <span class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>周次</span>
        <span class="v" id="mWeeks"></span>
      </div>
      <div class="m-row">
        <span class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>时间</span>
        <span class="v" id="mTime"></span>
      </div>
      <div class="m-row m-note">
        <span class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>备注</span>
        <span class="v" id="mNote"></span>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= Mock 数据 ================= */
var DAYS = [
  { label:'周一', date:'9/2' },
  { label:'周二', date:'9/3' },
  { label:'周三', date:'9/4', today:true },
  { label:'周四', date:'9/5' },
  { label:'周五', date:'9/6' },
  { label:'周六', date:'9/7' },
  { label:'周日', date:'9/8' }
];
var DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
var PERIODS = ['08:00–08:45','08:55–09:40','10:00–10:45','10:55–11:40','14:00–14:45','14:55–15:40','16:00–16:45','16:55–17:40'];
var COURSES = [
  { id:1,  name:'高等数学',      loc:'博学楼 A101', teacher:'陈志远', day:1, start:1, end:2, color:'blue',   weeks:'第 1–16 周', note:'教材：同济版《高等数学》上册。建议每周预留 2 小时完成课后习题，期中考试时间为 9 月 20 日。' },
  { id:2,  name:'大学英语',      loc:'外语楼 B203', teacher:'林晓雯', day:1, start:3, end:4, color:'green',  weeks:'第 1–16 周', note:'使用《新视野大学英语》第三册，每单元含听力与写作训练，请提前完成 Unit 3 预习。' },
  { id:3,  name:'线性代数',      loc:'博学楼 A305', teacher:'周明远', day:2, start:1, end:2, color:'purple', weeks:'第 1–16 周', note:'随堂小测计入平时成绩，请携带教材与计算器。' },
  { id:4,  name:'马克思主义原理', loc:'博学楼 B102', teacher:'赵立群', day:3, start:1, end:2, color:'orange',  weeks:'第 3–16 周', note:'本课程为单周开课，课堂讨论表现计入平时分。' },
  { id:5,  name:'大学物理',      loc:'理学楼 C101', teacher:'孙浩然', day:3, start:3, end:4, color:'cyan',   weeks:'第 1–16 周', note:'实验报告需提交至课程平台，截止时间为次周周一 23:59。' },
  { id:6,  name:'程序设计',      loc:'计算机楼 D402', teacher:'吴敏', day:4, start:1, end:2, color:'rose',   weeks:'第 1–16 周', note:'实验报告：9 月 15 日截止，内容为第 2 章数组与字符串练习。' },
  { id:7,  name:'数据结构',      loc:'计算机楼 D408', teacher:'吴敏', day:4, start:5, end:6, color:'indigo', weeks:'第 1–16 周', note:'上机课需自备笔记本电脑，安装好课程要求的开发环境。' },
  { id:8,  name:'体育',          loc:'田径场',       teacher:'刘凯',   day:5, start:7, end:8, color:'yellow', weeks:'第 1–16 周', note:'请穿运动装与运动鞋；如遇雨天，改至室内体育馆集合。' }
];
var ACCENT = {
  blue:'#3b82f6', green:'#16a34a', purple:'#8b5cf6', orange:'#f97316',
  cyan:'#06b6d4', rose:'#f43f5e', indigo:'#6366f1', yellow:'#eab308'
};

/* 第 5 周周一锚点（Mock：9 月 2 日 = 周一） */
var WEEK_ANCHOR = new Date(2026, 8, 2);
var weekOffset = 0;

function $(s){ return document.querySelector(s); }

/* ================= 构建周课表网格 ================= */
(function buildGrid(){
  var timeCol = $('#timeCol');
  PERIODS.forEach(function(p){
    var parts = p.split('–');
    var cell = document.createElement('div');
    cell.className = 'time-cell';
    cell.innerHTML = '<b>' + parts[0] + '</b><span>' + parts[1] + '</span>';
    timeCol.appendChild(cell);
  });

  var dayCols = $('#dayCols');
  DAYS.forEach(function(d){
    var col = document.createElement('div');
    col.className = 'day-col' + (d.today ? ' today' : '');
    var head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = '<div class="wd">' + d.label + (d.today ? '<span class="pill">今天</span>' : '') + '</div><div class="dt">' + d.date + '</div>';
    var body = document.createElement('div');
    body.className = 'day-body';
    col.appendChild(head);
    col.appendChild(body);
    dayCols.appendChild(col);
  });

  COURSES.forEach(function(c){
    var body = dayCols.children[c.day - 1].querySelector('.day-body');
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'course c-' + c.color;
    el.style.gridRow = c.start + ' / ' + (c.end + 1);
    el.setAttribute('aria-label', c.name + '，' + c.loc);
    el.innerHTML = '<span class="c-name">' + c.name + '</span><span class="c-loc">' + c.loc + '</span>';
    el.addEventListener('click', function(){ openModal(c); });
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(c); }
    });
    body.appendChild(el);
  });
})();

/* ================= 周导航 ================= */
function fmt(d){ return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function renderWeek(){
  var mon = new Date(WEEK_ANCHOR);
  mon.setDate(mon.getDate() + weekOffset * 7);
  var sun = new Date(mon);
  sun.setDate(sun.getDate() + 6);
  $('#weekTitle').innerHTML = '第 ' + (5 + weekOffset) + ' 周 · <span>' + fmt(mon) + '–' + fmt(sun) + '</span>';
}
$('#prevWeek').addEventListener('click', function(){ weekOffset--; renderWeek(); });
$('#nextWeek').addEventListener('click', function(){ weekOffset++; renderWeek(); });
$('#goNow').addEventListener('click', function(){ weekOffset = 0; renderWeek(); });

/* ================= 课程详情弹层 ================= */
var modal = $('#modal');
function openModal(c){
  var start = PERIODS[c.start - 1].split('–')[0];
  var end = PERIODS[c.end - 1].split('–')[1];
  $('#modalDot').style.background = ACCENT[c.color];
  $('#modalTitle').textContent = c.name;
  $('#mTeacher').textContent = c.teacher;
  $('#mLoc').textContent = c.loc;
  $('#mWeeks').textContent = c.weeks;
  $('#mTime').textContent = DAY_NAMES[c.day - 1] + ' ' + start + '–' + end;
  $('#mNote').textContent = c.note;
  modal.hidden = false;
  document.body.classList.add('no-scroll');
}
function closeModal(){
  modal.hidden = true;
  document.body.classList.remove('no-scroll');
}
$('#modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) closeModal(); });

/* ================= 视图切换（周课表 / 今天） ================= */
var segBtns = document.querySelectorAll('.seg-btn');
segBtns.forEach(function(b){
  b.addEventListener('click', function(){
    segBtns.forEach(function(x){ x.classList.toggle('active', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    var v = b.getAttribute('data-view');
    document.querySelectorAll('.week-mode').forEach(function(el){ el.hidden = (v !== 'week'); });
    $('#todayView').hidden = (v !== 'today');
  });
});

/* 今日视图：周三的课程列表 */
(function buildToday(){
  var todayCourses = COURSES.filter(function(c){ return c.day === 3; });
  $('#todayCount').textContent = '共 ' + todayCourses.length + ' 节课';
  var list = $('#todayList');
  todayCourses.forEach(function(c){
    var start = PERIODS[c.start - 1].split('–')[0];
    var end = PERIODS[c.end - 1].split('–')[1];
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'today-card';
    card.innerHTML =
      '<span class="tc-dot" style="background:' + ACCENT[c.color] + '"></span>' +
      '<span class="tc-time">' + start + '–' + end + '</span>' +
      '<span class="tc-main"><span class="tc-name">' + c.name + '</span><span class="tc-loc">' + c.loc + ' · ' + c.teacher + '</span></span>' +
      '<span class="tc-slot">第 ' + c.start + '–' + c.end + ' 节</span>';
    card.addEventListener('click', function(){ openModal(c); });
    list.appendChild(card);
  });
  if (todayCourses.length === 0) $('#todayEmpty').hidden = false;
})();

renderWeek();
</script>
</body>
</html>
