<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ClassBoard · 周课表（纸感手账）</title>
<style>
/* ============================================================
   ClassBoard · 风格 03「纸感手账」
   米黄纸感 / 细横格线 / 手写便签课程块 / 暖棕·墨蓝·陶土
   ============================================================ */
:root{
  --paper:#f5ecd8;
  --paper-2:#efe3c8;
  --card:#fffdf5;
  --ink:#4a3826;          /* 正文墨棕 */
  --ink-soft:#7a6248;     /* 次级文字（≥4.5:1） */
  --brown:#6b4f36;        /* 暖棕 */
  --blue:#33506b;         /* 墨蓝 */
  --terra:#b04a1e;        /* 陶土 */
  --line:rgba(150,118,72,.18);
  --tape:rgba(245,224,160,.68);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Comic Sans MS","Segoe Print","Segoe Script",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 520px at 88% -8%, rgba(196,158,96,.16), transparent 60%),
    radial-gradient(900px 460px at -6% 106%, rgba(122,90,62,.10), transparent 55%),
    repeating-linear-gradient(90deg, rgba(150,118,72,.045) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(0deg, rgba(150,118,72,.04) 0 1px, transparent 1px 32px),
    linear-gradient(var(--paper), #f0e5cb);
  min-height:100vh;
  line-height:1.5;
}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;flex:none}
svg{display:block}

/* ---------- 顶部导航 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 22px;
  background:linear-gradient(rgba(245,236,216,.97), rgba(243,232,208,.94));
  backdrop-filter:blur(4px);
  border-bottom:2px dashed rgba(107,79,54,.28);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-size:22px;font-weight:700;letter-spacing:1.5px;color:var(--brown);
  transform:rotate(-1deg);
}
.brand .logo{
  width:34px;height:34px;display:grid;place-items:center;color:var(--blue);
  border:2px solid var(--brown);border-radius:46% 54% 50% 50% / 50% 46% 54% 50%;
  background:rgba(255,253,245,.85);
}
.brand .logo .ic{width:20px;height:20px}

.seg{
  display:flex;gap:4px;margin:0 auto;
  background:rgba(255,253,245,.85);
  border:2px solid rgba(107,79,54,.4);
  border-radius:17px 14px 16px 13px;
  padding:4px;
}
.seg-btn{
  font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-soft);
  background:transparent;border:0;border-radius:12px 10px 11px 9px;
  padding:7px 22px;cursor:pointer;letter-spacing:1px;
}
.seg-btn:hover{color:var(--ink);background:rgba(196,158,96,.16)}
.seg-btn.is-active{
  background:var(--blue);color:#f6eeda;box-shadow:0 2px 0 rgba(60,40,20,.22);
  transform:rotate(-.5deg);
}
.top-actions{display:flex;align-items:center;gap:10px}
.btn-import{
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:1px;
  color:#f6eeda;background:var(--brown);
  border:2px solid var(--brown);border-radius:14px 11px 13px 10px;
  padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transform:rotate(.4deg);box-shadow:0 2px 0 rgba(60,40,20,.22);
  transition:transform .15s ease, background .15s ease;
}
.btn-import .ic{width:16px;height:16px}
.btn-import:hover{transform:rotate(0deg) translateY(-1px);background:#7c5c3e}
.icon-btn{
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:var(--brown);
  border:2px solid var(--brown);background:rgba(255,253,245,.9);
  transition:transform .18s ease, background .18s ease;
}
.icon-btn:hover{transform:rotate(45deg) scale(1.06);background:var(--brown);color:#f6eeda}

/* ---------- 周导航条 ---------- */
.weeknav{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px 6px;
}
.wn-btn{
  font-family:inherit;font-size:14px;font-weight:700;color:var(--blue);
  background:rgba(255,253,245,.75);
  border:2px dashed rgba(51,80,107,.5);border-radius:12px 10px 13px 11px;
  padding:7px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
  transition:background .15s ease, border-color .15s ease;
}
.wn-btn .ic{width:15px;height:15px}
.wn-btn:hover{background:rgba(51,80,107,.12);border-style:solid}
.wn-title{
  flex:1;text-align:center;
  font-size:17px;font-weight:700;letter-spacing:.5px;color:var(--brown);
  text-decoration:underline wavy rgba(176,74,30,.4) 1px;
  text-underline-offset:5px;
}

/* ---------- 布局 ---------- */
.layout{
  max-width:1280px;margin:0 auto;padding:12px 22px 44px;
  display:flex;flex-direction:column;gap:18px;align-items:stretch;
}
@media (min-width:1280px){
  .layout{flex-direction:row;align-items:flex-start}
}

/* ---------- 课表网格 ---------- */
.grid-scroll{
  position:relative;
  background:rgba(255,251,240,.78);
  border:2px solid rgba(107,79,54,.32);
  border-radius:18px 20px 16px 18px;
  box-shadow:0 3px 0 rgba(120,90,60,.10), inset 0 0 46px rgba(150,118,72,.05);
  padding:10px;
}
.weekgrid{
  display:grid;
  grid-template-columns:66px repeat(7,1fr);
  grid-auto-rows:60px;
}
@media (min-width:1280px){ .weekgrid{grid-auto-rows:78px} }
.cell{
  border-right:1px dashed var(--line);
  border-bottom:1px dashed var(--line);
  min-width:0;
}
.cell:last-child{border-right:0}
.head{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(rgba(239,227,200,.92), rgba(245,236,216,.92));
  border-bottom:2px solid rgba(107,79,54,.28);
}
.head-day{font-size:15px;font-weight:700;color:var(--brown);letter-spacing:1px}
.head-date{font-size:12px;color:var(--ink-soft)}
.head--today{position:relative}
.head--today .head-day{color:var(--terra)}
.head--today .head-date{
  background:linear-gradient(180deg, transparent 58%, rgba(255,213,110,.6) 58%, rgba(255,213,110,.6) 92%, transparent 92%);
  padding:0 5px;
}
.time{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  padding-right:10px;
  border-right:2px solid rgba(107,79,54,.35);
}
.time .t-no{font-size:15px;font-weight:700;color:var(--brown);line-height:1.2}
.time .t-time{font-size:9px;color:rgba(122,98,72,.9);letter-spacing:.2px}
.empty--today{background:linear-gradient(180deg, rgba(255,213,110,.16), rgba(255,213,110,.08))}
.corner{border-bottom:2px solid rgba(107,79,54,.28)}

/* ---------- 课程便签 ---------- */
.course-block{
  position:relative;z-index:2;
  font-family:inherit;text-align:left;cursor:pointer;
  background:var(--card);
  border:1.5px solid rgba(107,79,54,.32);
  border-left-width:4px;
  border-radius:9px 8px 10px 9px;
  margin:5px 6px;
  padding:8px 9px 6px 25px;
  box-shadow:0 2px 3px rgba(90,65,35,.14), inset 0 -1px 0 rgba(0,0,0,.04);
  transition:transform .18s ease, box-shadow .18s ease;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
}
.course-block::before{           /* 圆点贴纸 */
  content:"";position:absolute;left:9px;top:9px;
  width:9px;height:9px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.2);
}
.course-block::after{            /* 顶部胶带 */
  content:"";position:absolute;top:-7px;left:50%;
  transform:translateX(-50%) rotate(-2deg);
  width:46px;height:13px;
  background:linear-gradient(rgba(247,227,170,.9), rgba(240,214,140,.9));
  border-left:1px dashed rgba(190,160,90,.6);
  border-right:1px dashed rgba(190,160,90,.6);
  box-shadow:0 1px 2px rgba(120,90,50,.18);
}
.course-block:hover{transform:rotate(0deg) scale(1.03);box-shadow:0 5px 10px rgba(90,65,35,.22);z-index:5}
.cb-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px;line-height:1.25}
.cb-loc{font-size:11px;color:var(--ink-soft)}
.cb--blue{--c:#5b7fa6;border-left-color:var(--c)}
.cb--green{--c:#6e9a6b;border-left-color:var(--c)}
.cb--purple{--c:#8a6bb0;border-left-color:var(--c)}
.cb--orange{--c:#c67f3d;border-left-color:var(--c)}
.cb--cyan{--c:#4f97a0;border-left-color:var(--c)}
.cb--rose{--c:#c2687e;border-left-color:var(--c)}
.cb--indigo{--c:#6b72b8;border-left-color:var(--c)}
.cb--yellow{--c:#c9a53d;border-left-color:var(--c)}
.cb--c1{transform:rotate(-.9deg)} .cb--c2{transform:rotate(.6deg)}
.cb--c3{transform:rotate(.4deg)}  .cb--c4{transform:rotate(-.6deg)}
.cb--c5{transform:rotate(.9deg)}  .cb--c6{transform:rotate(-.4deg)}
.cb--c7{transform:rotate(.5deg)}  .cb--c8{transform:rotate(-.7deg)}

/* ---------- 今天视图 ---------- */
.view{flex:1;min-width:0}
.is-hidden{display:none}
.today-head{
  display:flex;align-items:baseline;gap:10px;
  font-size:18px;font-weight:700;color:var(--brown);
  margin:2px 2px 12px;
}
.today-head .ic{width:19px;height:19px;color:var(--terra);transform:translateY(3px)}
.today-head span{font-size:13px;font-weight:400;color:var(--ink-soft)}
.today-cards{display:flex;flex-direction:column;gap:16px}
.t-card{
  position:relative;background:var(--card);
  border:1.5px solid rgba(107,79,54,.32);border-left-width:5px;
  border-radius:12px 10px 13px 11px;
  padding:14px 16px 13px 18px;cursor:pointer;
  box-shadow:0 2px 4px rgba(90,65,35,.12);
  transition:transform .16s ease, box-shadow .16s ease;
}
.t-card::before{                 /* 贴纸圆点 */
  content:"";position:absolute;left:10px;top:13px;
  width:10px;height:10px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 2px rgba(255,255,255,.9);
}
.t-card::after{                  /* 胶带 */
  content:"";position:absolute;top:-8px;right:22px;
  transform:rotate(3deg);
  width:56px;height:14px;
  background:linear-gradient(rgba(247,227,170,.92), rgba(240,214,140,.92));
  border-left:1px dashed rgba(190,160,90,.6);
  border-right:1px dashed rgba(190,160,90,.6);
  box-shadow:0 1px 2px rgba(120,90,50,.18);
}
.t-card:hover{transform:rotate(0deg) scale(1.01);box-shadow:0 5px 12px rgba(90,65,35,.18)}
.tc--blue{--c:#5b7fa6;border-left-color:var(--c)}
.tc--green{--c:#6e9a6b;border-left-color:var(--c)}
.tc--purple{--c:#8a6bb0;border-left-color:var(--c)}
.tc--orange{--c:#c67f3d;border-left-color:var(--c)}
.tc--cyan{--c:#4f97a0;border-left-color:var(--c)}
.tc--rose{--c:#c2687e;border-left-color:var(--c)}
.tc--indigo{--c:#6b72b8;border-left-color:var(--c)}
.tc--yellow{--c:#c9a53d;border-left-color:var(--c)}
.tc-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tc-chip{
  font-size:12px;font-weight:700;color:var(--terra);
  border:1.5px dashed rgba(176,74,30,.5);border-radius:8px 6px 7px 5px;
  padding:2px 8px;
}
.tc-time{font-size:12.5px;color:var(--ink-soft)}
.tc-name{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.5px;margin-bottom:5px}
.tc-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.tc-meta .ic{width:14px;height:14px;color:var(--blue)}
.tc-meta .sep{opacity:.5;margin:0 2px}
.tc-note{
  font-size:13px;color:var(--ink);line-height:1.7;
  background:repeating-linear-gradient(0deg, transparent, transparent 21px, rgba(150,118,72,.18) 21px, rgba(150,118,72,.18) 22px);
  padding:4px 6px;border-radius:6px;
}

/* ---------- 右侧信息面板 ---------- */
.sidepanel{display:flex;flex-direction:column;gap:14px}
@media (min-width:1280px){ .sidepanel{width:252px;flex:none;position:sticky;top:84px} }
.panel-card{
  position:relative;
  background:rgba(255,251,240,.82);
  border:2px solid rgba(107,79,54,.3);
  border-radius:14px 16px 13px 15px;
  padding:14px 16px;
  box-shadow:0 2px 0 rgba(120,90,60,.08);
}
.panel-title{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--brown);letter-spacing:1px;
  border-bottom:2px dotted rgba(150,118,72,.4);
  padding-bottom:9px;margin-bottom:11px;
}
.panel-title .ic{width:16px;height:16px;color:var(--blue)}
.stats{display:flex;gap:12px}
.stat{
  flex:1;text-align:center;
  background:rgba(239,227,200,.65);
  border:1.5px dashed rgba(107,79,54,.28);
  border-radius:10px 8px 9px 7px;
  padding:9px 4px 7px;
}
.stat b{display:block;font-size:22px;color:var(--blue);line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink-soft)}
.panel-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.55}
.panel-item .ic{width:16px;height:16px;color:var(--terra);margin-top:2px}
.panel-item .pi-date{display:block;font-weight:700;color:var(--ink)}
.panel-item .pi-desc{display:block;color:var(--ink-soft)}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.is-open{display:block}
.modal-mask{position:absolute;inset:0;background:rgba(74,56,38,.45)}
.modal-card{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(-.6deg);
  width:min(430px, calc(100vw - 32px));
  background:var(--card);
  border:2px solid rgba(107,79,54,.42);
  border-radius:16px 14px 18px 15px;
  box-shadow:0 20px 44px rgba(60,40,20,.36), 0 2px 0 rgba(0,0,0,.1);
  padding:30px 26px 24px;
  max-height:calc(100vh - 40px);overflow:auto;
}
.modal-card::before{           /* 顶部胶带标签 */
  content:"";position:absolute;top:-11px;left:50%;
  transform:translateX(-50%) rotate(-1.5deg);
  width:88px;height:22px;
  background:linear-gradient(rgba(247,227,170,.92), rgba(240,214,140,.92));
  border-left:1px dashed rgba(190,160,90,.6);
  border-right:1px dashed rgba(190,160,90,.6);
  box-shadow:0 2px 4px rgba(120,90,50,.2);
}
.modal-close{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;
  border:2px solid var(--brown);background:var(--card);color:var(--brown);
}
.modal-close:hover{background:var(--brown);color:#f6eeda}
.modal-close .ic{width:15px;height:15px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.m-dot{width:14px;height:14px;border-radius:50%;background:var(--mc,#5b7fa6);box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.2)}
.modal-name{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:1px}
.modal-body{display:flex;flex-direction:column}
.info-row{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 0;font-size:14px;
  border-bottom:1px dashed rgba(150,118,72,.28);
}
.info-row .ic{width:16px;height:16px;color:var(--blue);margin-top:3px}
.info-label{flex:none;width:46px;color:var(--ink-soft);font-size:13px}
.info-row .iv{color:var(--ink);font-weight:700}
.note-row{padding:12px 0 2px}
.note{
  font-size:13.5px;color:var(--ink);line-height:23px;
  background:repeating-linear-gradient(0deg, transparent, transparent 22px, rgba(150,118,72,.18) 22px, rgba(150,118,72,.18) 23px);
  border:1.5px dashed rgba(150,118,72,.45);
  border-radius:10px;padding:10px 13px;
}

/* ---------- 响应式 ---------- */
@media (min-width:768px) and (max-width:1279px){
  .weekgrid{grid-auto-rows:58px}
  .sidepanel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .sidepanel .panel-card{display:flex;flex-direction:column}
  .sidepanel .panel-title{margin-bottom:8px}
  .sidepanel .panel-card .stats{flex:1;align-items:center}
  .sidepanel .panel-card .panel-item{flex:1}
}
@media (max-width:767px){
  .topbar{padding-top:max(12px, env(safe-area-inset-top))}
  .brand{order:1}.top-actions{order:2}
  .seg{order:3;flex-basis:100%;justify-content:center;margin:2px 0 4px}
  .weeknav{padding:12px 14px 4px}
  .wn-title{font-size:15px}
  .layout{padding:10px 12px 36px}
  .grid-scroll{
    overflow:auto;-webkit-overflow-scrolling:touch;
    max-height:74vh;overscroll-behavior:contain;
    border-radius:14px;padding:8px;
  }
  .weekgrid{min-width:790px;grid-auto-rows:66px}
  .head{position:sticky;top:0;z-index:6}
  .time{position:sticky;left:0;z-index:5}
  .corner{position:sticky;top:0;left:0;z-index:7}
}
button:focus-visible,.course-block:focus-visible,.t-card:focus-visible{
  outline:2px dashed var(--terra);outline-offset:2px;
}
</style>
</head>
<body>

<!-- 内联 SVG 图标库 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10.5h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 6 9 12l5.5 6"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6 15 12l-5.5 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.5S5.5 15.9 5.5 11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 10.5-6.5 10.5z"/><circle cx="12" cy="10.8" r="2.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.3-3.5 4-5.1 7-5.1s5.7 1.6 7 5.1"/></symbol>
  <symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10.5h18M8 3v4M16 3v4"/><path d="M8.5 15h3"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M4.5 20 5.8 15.5 16.4 4.9a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L9 18.7 4.5 20z"/><path d="M14.5 7l2.6 2.6"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21.5V4"/><path d="M6 4.5h12l-3 4 3 4H6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 11.5A8.5 8.5 0 1 0 19 17.5"/><path d="M20.5 5.5v6h-6"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="logo"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg></span>
    ClassBoard
  </div>
  <div class="seg" role="tablist" aria-label="视图切换">
    <button class="seg-btn is-active" data-view="week" role="tab" aria-selected="true">周课表</button>
    <button class="seg-btn" data-view="today" role="tab" aria-selected="false">今天</button>
  </div>
  <div class="top-actions">
    <button class="btn-import"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>导入课程</button>
    <button class="icon-btn" aria-label="设置"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </div>
</header>

<nav class="weeknav" aria-label="周导航">
  <button class="wn-btn" id="prevWeek"><svg class="ic" aria-hidden="true"><use href="#i-chev-l"/></svg>上一周</button>
  <div class="wn-title" id="weekTitle">第 5 周 · 9月2日–9月8日</div>
  <button class="wn-btn" id="nextWeek">下一周<svg class="ic" aria-hidden="true"><use href="#i-chev-r"/></svg></button>
  <button class="wn-btn" id="backWeek"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>回到本周</button>
</nav>

<main class="layout">
  <!-- 周课表视图 -->
  <section class="view" id="weekView">
    <div class="grid-scroll">
      <div class="weekgrid" id="weekgrid"></div>
    </div>
  </section>

  <!-- 今天视图 -->
  <section class="view is-hidden" id="todayView">
    <div class="today-head">
      <svg class="ic" aria-hidden="true"><use href="#i-week"/></svg>
      <span id="todayTitle">今天 · 周三 9/4</span>
      <span>共 2 节课</span>
    </div>
    <div class="today-cards" id="todayCards"></div>
  </section>

  <!-- 右侧信息面板 -->
  <aside class="sidepanel">
    <div class="panel-card">
      <h3 class="panel-title"><svg class="ic" aria-hidden="true"><use href="#i-week"/></svg>本周摘要</h3>
      <div class="stats">
        <div class="stat"><b>8</b><span>课程 门数</span></div>
        <div class="stat"><b>4</b><span>已上 门数</span></div>
      </div>
    </div>
    <div class="panel-card">
      <h3 class="panel-title"><svg class="ic" aria-hidden="true"><use href="#i-flag"/></svg>考试</h3>
      <div class="panel-item">
        <svg class="ic" aria-hidden="true"><use href="#i-flag"/></svg>
        <div><span class="pi-date">9月20日</span><span class="pi-desc">高等数学 期中考试</span></div>
      </div>
    </div>
    <div class="panel-card">
      <h3 class="panel-title"><svg class="ic" aria-hidden="true"><use href="#i-note"/></svg>作业</h3>
      <div class="panel-item">
        <svg class="ic" aria-hidden="true"><use href="#i-note"/></svg>
        <div><span class="pi-date">9月15日</span><span class="pi-desc">程序设计 实验报告 截止</span></div>
      </div>
    </div>
  </aside>
</main>

<!-- 课程详情弹层 -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-mask" data-close></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button class="modal-close" data-close aria-label="关闭"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    <div class="modal-head">
      <span class="m-dot" id="mDot"></span>
      <h3 class="modal-name" id="modalName">课程</h3>
    </div>
    <div class="modal-body">
      <div class="info-row">
        <svg class="ic" aria-hidden="true"><use href="#i-user"/></svg>
        <span class="info-label">教师</span><span class="iv" id="mTeacher"></span>
      </div>
      <div class="info-row">
        <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
        <span class="info-label">地点</span><span class="iv" id="mLoc"></span>
      </div>
      <div class="info-row">
        <svg class="ic" aria-hidden="true"><use href="#i-week"/></svg>
        <span class="info-label">周次</span><span class="iv" id="mWeeks"></span>
      </div>
      <div class="info-row">
        <svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg>
        <span class="info-label">时间</span><span class="iv" id="mTime"></span>
      </div>
      <div class="note-row">
        <div class="note" id="mNote"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 数据契约（两个风格页面完全一致） ================= */
var DAYS = [
  { label: '周一', date: '9/2' },
  { label: '周二', date: '9/3' },
  { label: '周三', date: '9/4', today: true },
  { label: '周四', date: '9/5' },
  { label: '周五', date: '9/6' },
  { label: '周六', date: '9/7' },
  { label: '周日', date: '9/8' }
];
var PERIODS = [
  { start: '08:00', end: '08:45' },
  { start: '08:55', end: '09:40' },
  { start: '10:00', end: '10:45' },
  { start: '10:55', end: '11:40' },
  { start: '14:00', end: '14:45' },
  { start: '14:55', end: '15:40' },
  { start: '16:00', end: '16:45' },
  { start: '16:55', end: '17:40' }
];
var COURSES = [
  { id: 'c1', name: '高等数学',     loc: '博学楼 A101',   teacher: '王立群', day: 0, start: 1, span: 2, weeks: '第 1-16 周', note: '第 3 章 微分中值定理；记得带教材与作业本。',       color: 'blue' },
  { id: 'c2', name: '大学英语',     loc: '外语楼 B203',   teacher: '林青',   day: 0, start: 3, span: 2, weeks: '第 1-16 周', note: 'Unit 3 精读，预习课文并完成单词听写。',             color: 'green' },
  { id: 'c3', name: '线性代数',     loc: '博学楼 A305',   teacher: '陈慧敏', day: 1, start: 1, span: 2, weeks: '第 1-16 周', note: '行列式复习；完成作业 2.3–2.6。',                   color: 'purple' },
  { id: 'c4', name: '马克思主义原理', loc: '博学楼 B102', teacher: '刘建国', day: 2, start: 1, span: 2, weeks: '单周',      note: '小组展示：唯物辩证法，请提前拷贝 PPT。',           color: 'orange' },
  { id: 'c5', name: '大学物理',     loc: '理学楼 C101',   teacher: '赵航',   day: 2, start: 3, span: 2, weeks: '第 1-16 周', note: '力学部分 · 牛顿定律应用，带上计算器。',             color: 'cyan' },
  { id: 'c6', name: '程序设计',     loc: '计算机楼 D402', teacher: '吴桐',   day: 3, start: 1, span: 2, weeks: '第 1-16 周', note: '实验报告 9 月 15 日截止，请先提交到学习平台。',     color: 'rose' },
  { id: 'c7', name: '数据结构',     loc: '计算机楼 D408', teacher: '孙明远', day: 3, start: 5, span: 2, weeks: '第 1-16 周', note: '栈与队列章节练习；上机验证程序结果。',             color: 'indigo' },
  { id: 'c8', name: '体育',         loc: '田径场',       teacher: '周凯',   day: 4, start: 7, span: 2, weeks: '每周',      note: '着运动装，遇雨改室内羽毛球馆。',                   color: 'yellow' }
];
var MODAL_COLOR = {
  blue:'#5b7fa6', green:'#6e9a6b', purple:'#8a6bb0', orange:'#c67f3d',
  cyan:'#4f97a0', rose:'#c2687e', indigo:'#6b72b8', yellow:'#c9a53d'
};

/* ================= 渲染周课表 ================= */
var grid = document.getElementById('weekgrid');
var html = '<div class="cell corner"></div>';
DAYS.forEach(function(d){
  html += '<div class="cell head' + (d.today ? ' head--today' : '') + '">' +
          '<span class="head-day">' + d.label + '</span>' +
          '<span class="head-date">' + d.date + '</span></div>';
});
PERIODS.forEach(function(p, pi){
  html += '<div class="cell time"><span class="t-no">' + (pi + 1) + '</span>' +
          '<span class="t-time">' + p.start + '–' + p.end + '</span></div>';
  for (var i = 0; i < 7; i++){
    html += '<div class="cell empty' + (DAYS[i].today ? ' empty--today' : '') + '"></div>';
  }
});
grid.innerHTML = html;

COURSES.forEach(function(c){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'course-block cb--' + c.color + ' cb--' + c.id;
  b.style.gridRow = (c.start + 1) + ' / span ' + c.span;
  b.style.gridColumn = (c.day + 2);
  b.setAttribute('aria-label', c.name + '，' + c.loc + '，第 ' + c.start + '-' + (c.start + c.span - 1) + ' 节');
  b.innerHTML = '<span class="cb-name">' + c.name + '</span><span class="cb-loc">' + c.loc + '</span>';
  b.addEventListener('click', function(){ openModal(c); });
  grid.appendChild(b);
});

/* ================= 渲染今天视图 ================= */
var todayCards = document.getElementById('todayCards');
var todayList = COURSES.filter(function(c){ return DAYS[c.day].today; });
todayList.forEach(function(c){
  var p1 = PERIODS[c.start - 1];
  var p2 = PERIODS[c.start + c.span - 2];
  var card = document.createElement('article');
  card.className = 't-card tc--' + c.color;
  card.tabIndex = 0;
  card.innerHTML =
    '<div class="tc-top">' +
      '<span class="tc-chip">第 ' + c.start + '-' + (c.start + c.span - 1) + ' 节</span>' +
      '<span class="tc-time">' + p1.start + '–' + p2.end + '</span>' +
    '</div>' +
    '<h4 class="tc-name">' + c.name + '</h4>' +
    '<p class="tc-meta">' +
      '<svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>' + c.loc +
      '<span class="sep">·</span>' +
      '<svg class="ic" aria-hidden="true"><use href="#i-user"/></svg>' + c.teacher +
      '<span class="sep">·</span>' +
      '<svg class="ic" aria-hidden="true"><use href="#i-week"/></svg>' + c.weeks +
    '</p>' +
    '<p class="tc-note">' + c.note + '</p>';
  card.addEventListener('click', function(){ openModal(c); });
  card.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(c); }
  });
  todayCards.appendChild(card);
});

/* ================= 视图切换 ================= */
var weekView = document.getElementById('weekView');
var todayView = document.getElementById('todayView');
document.querySelectorAll('.seg-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.seg-btn').forEach(function(b){
      b.classList.toggle('is-active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    var isToday = btn.getAttribute('data-view') === 'today';
    weekView.classList.toggle('is-hidden', isToday);
    todayView.classList.toggle('is-hidden', !isToday);
  });
});

/* ================= 周导航 ================= */
var weekOffset = 0;
var weekTitle = document.getElementById('weekTitle');
var BASE = new Date(2026, 8, 2); /* 第 5 周起点 9/2 */
function fmt(d){ return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function renderWeek(){
  var s = new Date(BASE); s.setDate(s.getDate() + weekOffset * 7);
  var e = new Date(s); e.setDate(e.getDate() + 6);
  weekTitle.textContent = '第 ' + (5 + weekOffset) + ' 周 · ' + fmt(s) + '–' + fmt(e);
}
document.getElementById('prevWeek').addEventListener('click', function(){ weekOffset--; renderWeek(); });
document.getElementById('nextWeek').addEventListener('click', function(){ weekOffset++; renderWeek(); });
document.getElementById('backWeek').addEventListener('click', function(){ weekOffset = 0; renderWeek(); });

/* ================= 课程详情弹层 ================= */
var modal = document.getElementById('modal');
function openModal(c){
  var p1 = PERIODS[c.start - 1];
  var p2 = PERIODS[c.start + c.span - 2];
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('mTeacher').textContent = c.teacher;
  document.getElementById('mLoc').textContent = c.loc;
  document.getElementById('mWeeks').textContent = c.weeks;
  document.getElementById('mTime').textContent =
    DAYS[c.day].label + ' 第 ' + c.start + '-' + (c.start + c.span - 1) + ' 节 · ' + p1.start + '–' + p2.end;
  document.getElementById('mNote').textContent = c.note;
  document.getElementById('mDot').style.background = MODAL_COLOR[c.color];
  modal.classList.add('is-open');
  modal.setAttribute('aria-hidden', 'false');
}
function closeModal(){
  modal.classList.remove('is-open');
  modal.setAttribute('aria-hidden', 'true');
}
modal.querySelectorAll('[data-close]').forEach(function(el){
  el.addEventListener('click', closeModal);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
});
</script>
</body>
</html>
